server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;

    client_max_body_size 20m;   # large CSV imports / designs with embedded images

    # Static frontend
    location / {
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # App code changes on every deploy — always revalidate
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Public registration / kiosk page: /r/<code>
    location /r/ {
        add_header Cache-Control "no-cache";
        try_files /register.html =404;
    }

    # REST API
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # Eventbrite imports of big events can take a while
    }

    # WebSocket
    location /ws/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
